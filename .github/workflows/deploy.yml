name: Deploy to GitHub Pages

# Pages must be set to deploy from GitHub Actions (Settings → Pages → Source).
# With "Deploy from a branch", GitHub also publishes the raw repository, whose
# index.html loads src/main.ts directly, and the site breaks.
on:
  push:
    branches: ['main']
  # Re-publish without a commit, e.g. after changing the Pages source.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  get-playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Playwright version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/g, '')")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  test-and-prepare:
    needs: get-playwright-version
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.get-playwright-version.outputs.version }}-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 25.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Run E2E tests
        run: npx playwright test

      - name: Build
        run: npm run build
        env:
          VITE_PLAYGROUND_VERSION: main@${{ github.sha }}

      # Releases (v1.0.0, …) stay published under v/<version>/, so CI workflows
      # can pin one (playground-version in the sholtomaud/tsrs-monaco/ci action).
      # release.yml adds each release to the pages-releases branch.
      - name: Fetch the published releases
        id: releases
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: pages-releases
          path: releases

      - name: Add the releases to the site
        if: steps.releases.outcome == 'success'
        run: if [ -d releases/v ]; then cp -r releases/v dist/v; fi

      - name: Prepare 404 page for SPA
        run: cp dist/index.html dist/404.html

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: test-and-prepare
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
