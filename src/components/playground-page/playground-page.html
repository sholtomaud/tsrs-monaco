<div class="playground">
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="flex items-center gap-2 min-w-0">
      <span id="status-dot" class="status-dot" data-state="loading"></span>
      <span id="status" class="text-sm text-[var(--boba-text-muted)] truncate">Loading tsrs.wasm…</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="reset" class="btn btn-ghost" title="Restore the example project">Reset</button>
      <button id="stop" class="btn btn-ghost" disabled title="Terminate the running worker">Stop</button>
      <button id="run" class="btn btn-primary" title="Compile and run (Ctrl/⌘ + Enter)">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" /></svg>
        Run
      </button>
    </div>
  </div>

  <div class="panes">
    <!-- Source editor -->
    <section class="pane" aria-label="Source">
      <div class="tabs" role="tablist" aria-label="Files">
        <div id="file-tabs" class="flex items-stretch min-w-0 overflow-x-auto"></div>
        <button id="add-file" class="tab tab-add" title="Add a file">+</button>
      </div>
      <div id="editor" class="editor"></div>
    </section>

    <!-- Output -->
    <section class="pane" aria-label="Output">
      <div class="tabs" role="tablist" aria-label="Output">
        <button class="tab" role="tab" data-panel="console" aria-selected="true">Console</button>
        <button class="tab" role="tab" data-panel="js" aria-selected="false">JavaScript</button>
        <button class="tab" role="tab" data-panel="problems" aria-selected="false">
          Problems <span id="problem-count" class="badge" data-count="0">0</span>
        </button>
      </div>
      <div class="panel" data-panel="console">
        <div id="console" class="console" aria-live="polite">
          <div class="console-line console-system">Press Run (Ctrl/⌘ + Enter) to compile with tsrs and execute the output in a Web Worker.</div>
        </div>
      </div>
      <div class="panel" data-panel="js" hidden>
        <div id="js-label" class="panel-caption"></div>
        <div id="js-output" class="editor"></div>
      </div>
      <div class="panel" data-panel="problems" hidden>
        <ul id="problems" class="problems"></ul>
      </div>
    </section>
  </div>

  <div class="statusbar">
    <span id="stats">tsrs (TypeScript 7 in Rust) · WebAssembly</span>
    <span id="version" class="font-mono"></span>
  </div>
</div>

<template id="file-tab-template">
  <div class="tab file-tab" role="tab">
    <button class="file-name"></button>
    <button class="file-close" title="Delete file" aria-label="Delete file">×</button>
  </div>
</template>

<template id="console-line-template">
  <div class="console-line"></div>
</template>

<template id="problem-template">
  <li class="problem">
    <button class="problem-button">
      <span class="problem-severity"></span>
      <span class="problem-message"></span>
      <span class="problem-location"></span>
    </button>
  </li>
</template>
